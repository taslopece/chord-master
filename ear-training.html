<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="通过真实吉他音色训练常用和弦的听辨能力。" />
  <title>听辨训练 · Chord Master</title>
  <link rel="stylesheet" href="assets/css/common.css" />
  <style>
    .page-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.page-head h1{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.05em;margin:8px 0 0}.session-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#0b1528;border:1px solid #22324e;border-radius:10px;padding:9px 12px;text-align:center;min-width:72px}.stat span{display:block;color:var(--muted);font-size:.67rem;margin-bottom:4px}.stat b{font-size:1.05rem}.training-layout{display:grid;grid-template-columns:300px 1fr;gap:18px}.settings{padding:20px;align-self:start}.settings h2,.question h2{font-size:1rem;margin:0 0 14px}.setting-group{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.setting-label{display:block;color:var(--muted);font-size:.76rem;font-weight:700;margin-bottom:10px}.check-list{display:grid;gap:8px}.check{display:flex;gap:9px;align-items:center;font-size:.88rem;cursor:pointer}.check input{accent-color:var(--gold);width:16px;height:16px}.mode-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mode{border:1px solid #3b4a6b;background:#17243c;color:#dbe4f4;border-radius:8px;padding:8px 4px;font:inherit;font-size:.75rem;cursor:pointer}.mode.active{background:var(--teal);border-color:var(--teal);color:#092137;font-weight:800}.settings .button{width:100%;margin-top:20px}.question{padding:24px;min-height:520px;display:flex;flex-direction:column}.question-top{display:flex;justify-content:space-between;align-items:center}.question-number{color:var(--muted);font-size:.76rem}.sound-stage{display:grid;place-items:center;text-align:center;min-height:190px;margin:18px 0;border:1px solid #243553;border-radius:14px;background:radial-gradient(circle at 50% 45%,rgba(121,213,198,.12),transparent 48%),#0b1528}.sound-icon{font-size:3.2rem;color:var(--teal);margin-bottom:8px}.sound-stage p{color:var(--muted);font-size:.82rem;margin:8px 0 0}.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.answer{border:1px solid #3b4a6b;background:#14223a;color:var(--ink);border-radius:10px;padding:13px 8px;font:inherit;font-size:.84rem;font-weight:750;cursor:pointer}.answer:hover,.answer.selected{border-color:var(--gold);color:var(--gold)}.answer.correct{border-color:var(--success);background:rgba(141,224,173,.12);color:var(--success)}.answer.wrong{border-color:var(--danger);background:rgba(255,143,135,.1);color:var(--danger)}.answer:disabled{cursor:default}.actions{display:flex;gap:8px;margin-top:14px}.feedback{display:none;margin-top:18px;padding:16px;border-radius:12px;background:#0b1528;border:1px solid #263958}.feedback.show{display:block}.feedback.good{border-color:rgba(141,224,173,.5)}.feedback.bad{border-color:rgba(255,143,135,.5)}.feedback h3{margin:0 0 8px;font-size:1.05rem}.feedback p{color:var(--muted);font-size:.85rem;line-height:1.6;margin:6px 0}.feedback strong{color:var(--ink)}.feedback a{color:var(--gold)}@media(max-width:850px){.page-head{display:block}.session-stats{margin-top:18px}.training-layout{grid-template-columns:1fr}.answers{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.session-stats{grid-template-columns:repeat(2,1fr)}.question{padding:16px}.actions{flex-wrap:wrap}}
    .answers{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  </style>
</head>
<body><main class="shell">
  <nav class="site-nav"><a class="brand" href="index.html">Chord Master</a><div class="nav-links"><a href="chord-atlas.html">和弦图鉴</a><a class="active" href="ear-training.html">听辨训练</a></div></nav>
  <header class="page-head"><div><div class="eyebrow">Ear training</div><h1>听声音，认和弦</h1></div><div class="session-stats"><div class="stat"><span>题目</span><b id="questionCount">0</b></div><div class="stat"><span>答对</span><b id="correctCount">0</b></div><div class="stat"><span>正确率</span><b id="accuracy">—</b></div><div class="stat"><span>连续答对</span><b id="streak">0</b></div></div></header>
  <div class="training-layout">
    <aside class="panel settings"><h2>训练设置</h2><div class="setting-group"><span class="setting-label">参与出题的和弦</span><div class="check-list" id="typeSettings"></div></div><div class="setting-group"><span class="setting-label">默认播放方式</span><div class="mode-row"><button class="mode active" data-mode="chord">齐奏</button><button class="mode" data-mode="strum">扫弦</button><button class="mode" data-mode="arp">琶音</button></div></div><button class="button primary" id="newQuestion">生成第一题</button></aside>
    <section class="panel question"><div class="question-top"><div class="eyebrow">Listen & choose</div><span class="question-number" id="questionLabel">尚未开始</span></div><div class="sound-stage"><div><div class="sound-icon">◖♪◗</div><button class="button teal" id="playQuestion" disabled>▶ 播放题目</button><p id="soundStatus">先从左侧生成第一题</p></div></div><h2>你听到的是哪一种和弦？</h2><div class="answers" id="answers"></div><div class="actions"><button class="button primary" id="submitAnswer" disabled>提交答案</button><button class="button" id="nextQuestion" hidden>下一题 →</button><button class="button" id="stopAudio" disabled>■ 停止</button></div><div class="feedback" id="feedback" aria-live="polite"></div></section>
  </div>
</main>
<script src="assets/js/music-theory.js"></script><script src="assets/js/audio-engine.js"></script><script src="assets/js/ear-training.js"></script>
</body></html>
